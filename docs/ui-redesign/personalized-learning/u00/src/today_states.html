<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>U00 Today states</title><link rel="stylesheet" href="u00.css"></head><body>
<div class="board">
<div class="fixture">Fixture — số liệu minh họa, không phải dữ liệu sản phẩm</div>
<h1>U00 · Today đề xuất (Hero-first) — các trạng thái</h1>
<p class="note">Mỗi trạng thái có một CTA đúng nghĩa và không có số liệu giả. “Đến hạn” chỉ xuất hiện khi lịch ôn (L04) có dữ liệu; trước đó Today dùng trạng thái 2.</p>
<div class="row" id="r1"></div><div class="row" id="r2"></div></div>
<script>
const DECK='JLPT N5 · Từ vựng đời sống';
const head=`<div class="lt">Hôm nay</div>`;
const rowsDeck=`<div class="list" style="margin-top:12px"><div class="li"><span class="body">Bộ thẻ đang học</span><span class="v">Đổi <i data-i="chevR" data-s="16"></i></span></div><div class="li"><span class="body">Thời lượng phiên</span><span class="v">5 phút <i data-i="chevR" data-s="16"></i></span></div></div>`;
const levels=`<div class="list" style="margin-top:6px"><div class="li"><span class="body">Học theo cấp độ</span><span class="v"><i data-i="chevR" data-s="16"></i></span></div></div>`;
const hero=(eyebrow,title,big,sub,cta,extra='')=>`<div class="hero" style="margin-top:14px;padding:20px"><div class="eyebrow" style="color:var(--onHero2)">${eyebrow}</div><div class="head" style="margin-top:4px">${title}</div>${big}<div class="meta" style="color:var(--onHero2);margin:8px 0 16px">${sub}</div>${cta}${extra}</div>`;
const heroBtn=t=>`<div class="btn hero">${t} <i data-i="arrowR" data-s="18"></i></div>`;
const num=(n,l)=>`<div style="display:flex;align-items:baseline;gap:10px;margin-top:14px"><span class="mincho" style="font-size:64px;line-height:1">${n}</span><span class="body" style="color:var(--onHero2)">${l}</span></div>`;
const ph=body=>`<div class="phone" data-tab="0"><div class="page">${head}${body}</div></div>`;
const S=[
 [ph(`<div class="sub" style="margin-top:2px">Chưa có bộ thẻ nào.</div>${hero('BẮT ĐẦU','Bắt đầu với bộ thẻ của bạn',`<div class="body" style="margin-top:12px;color:var(--onHero2)">Tạo bộ thẻ từ những từ bạn đang học, hoặc học theo cấp độ.</div>`,'',heroBtn('Tạo bộ thẻ'))}${levels}`),'1 · Chưa có bộ thẻ','Không số liệu, không dashboard rỗng; lối chính là tạo bộ thẻ, lối phụ là Cấp độ.'],
 [ph(`<div class="sub" style="margin-top:2px">Chưa ôn bộ thẻ này lần nào.</div>${hero('BỘ THẺ ĐANG HỌC',DECK,'<div class="body" style="margin-top:14px;font-size:21px;font-weight:600">24 thẻ · chưa có lượt học</div>','Thẻ chưa học không được tính là đến hạn.',heroBtn('Luyện bộ thẻ này'))}${rowsDeck}<div class="sechead">Tiến bộ hôm nay</div><div class="meta">Chưa có lượt nào được lưu.</div>${levels}`),'2 · Có bộ thẻ, chưa có lượt học','CTA là “Luyện” (không phải “Ôn”) — tránh gọi thẻ chưa học là quên/đến hạn.'],
 [ph(`<div class="sub" style="margin-top:2px">Hôm nay chưa có mục cần ôn.</div>${hero('BỘ THẺ ĐANG HỌC',DECK,'<div class="body" style="margin-top:14px;font-size:21px;font-weight:600">Chưa có mục đến hạn</div>','Bạn có thể luyện thêm khi muốn.',heroBtn('Luyện thêm'))}${rowsDeck}<div class="sechead">Tiến bộ hôm nay</div><div class="meta">Chưa có lượt nào được lưu hôm nay.</div>${levels}`),'3 · Không có mục đến hạn','Không đồng nhất với “đã hoàn thành”: hôm nay có thể chưa học gì.'],
 [ph(`<div class="sub" style="margin-top:2px">Phần cần ôn hôm nay đã xong.</div>${hero('BỘ THẺ ĐANG HỌC',DECK,'<div style="display:flex;align-items:center;gap:10px;margin-top:14px"><i data-i="check" data-s="30"></i><span class="body" style="font-size:21px;font-weight:600">Đã lưu 12 lượt hôm nay</span></div>','Quiz 9 · Tự đánh giá 3','<div class="btn hero">Xem kết quả</div><div style="text-align:center;margin-top:14px;font-weight:600;font-size:15px;color:var(--onHero)">Luyện thêm</div>')}${rowsDeck}${levels}`),'4 · Đã xong hôm nay','Có điểm kết thúc rõ; “Luyện thêm” là lựa chọn, không ép học tiếp. Không streak.'],
 [ph(`<div class="sub" style="margin-top:2px">Chào mừng quay lại. Bắt đầu nhẹ nhàng nhé.</div>${hero('BỘ THẺ ĐANG HỌC',DECK,num('12','trong 87 mục cần ôn'),'Phiên nhỏ ≈ 4 phút · 75 mục còn lại vẫn đang chờ',heroBtn('Bắt đầu phiên nhỏ'))}${rowsDeck}${levels}`),'5 · Quay lại sau nghỉ dài','Phiên nhỏ trong ngân sách thời gian, nhưng tổng tồn (87) hiển thị thật. Không trách móc, không mất streak.'],
 [ph(`<div class="sub" style="margin-top:2px">&nbsp;</div><div class="card" style="margin-top:14px;padding:22px 18px;text-align:center"><div style="color:var(--warn)"><i data-i="warn" data-s="30"></i></div><div class="head" style="margin-top:8px">Chưa đọc được tiến độ</div><div class="meta" style="margin:6px 0 16px">Dữ liệu học trên máy chưa mở được. Dữ liệu của bạn không bị xóa.</div><div class="btn sec" style="height:48px;min-height:48px">Thử lại</div></div>${levels}`),'6 · Lưu trữ lỗi','Không dùng số 0 thay lỗi; Cấp độ vẫn truy cập được; không tự xóa dữ liệu.']];
S.forEach((s,i)=>(i<3?r1:r2).innerHTML+=`<div class="cell">${s[0]}<div class="cap"><b>${s[1]}</b>${s[2]}</div></div>`);
</script><script src="u00.js"></script></body></html>
